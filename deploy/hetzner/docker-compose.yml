x-security: &security
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '3'


services:
  # Holds an OUTBOUND connection to Cloudflare, so nothing has to connect
  # inward to this box. Added 2026-08-17 after the Cloudflare->origin hop
  # started dropping ~65-75% of inbound TCP handshakes (SYN-ACKs went
  # unacknowledged; origin was provably healthy — 12/12 global regions and
  # 0/76 direct requests OK). Traffic goes to Caddy, not to services directly,
  # so per-site config (nakama CORS, yt flush_interval, api path allowlist)
  # still applies. Public hostnames are configured in the Cloudflare
  # dashboard: Zero Trust -> Networks -> Tunnels, each pointing at
  # https://caddy:443 with originServerName set to that hostname.
  cloudflared:
    networks: [edge]
    mem_limit: 256m
    cpus: '0.5'
    image: cloudflare/cloudflared:latest
    <<: *security
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - caddy

  caddy:
    networks: [edge, app]
    mem_limit: 256m
    cpus: '0.5'
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2
    <<: *security
    restart: unless-stopped
    ports:
      - '${CADDY_BIND_ADDRESS:-127.0.0.1}:80:80'
      - '${CADDY_BIND_ADDRESS:-127.0.0.1}:443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - youtube-api
      - dream-npc
      - image-upload
      - nakama

  server:
    networks: [app]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 1g
    cpus: '1.5'
    build:
      context: ../..
      dockerfile: Dockerfile.server
    <<: *security
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2567
      - YOUTUBE_SERVICE_URL=http://youtube-api:8081
      - DREAM_NPC_SERVICE_URL=http://dream-npc:4000
      - NAKAMA_ENCRYPTION_KEY=${NAKAMA_ENCRYPTION_KEY}
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY:?Set a random 32+ character capability signing key}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set a separate random 32+ character service token}
      # Public-lobby NPC DJ: fills the booth when no humans are queued,
      # yields instantly when one joins. See server/CLAUDE.md.
      - NPC_DJ_LOBBY=fallback:default
    expose:
      - '2567'

  youtube-api:
    networks: [app]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 2g
    cpus: '2.0'
    build:
      context: ../../services
      dockerfile: youtube-api/Dockerfile
    <<: *security
    restart: unless-stopped
    environment:
      - PORT=8081
      - YOUTUBE_API_CACHE_TTL=3600
      - VIDEO_CACHE_SIZE_MB=1000
      - PROXY_URL=${PROXY_URL}
      - POT_PROVIDER_URL=http://pot-provider:4416
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    volumes:
      - ./cookies.txt:/etc/youtube-api/cookies.txt:ro
      # Without this the disk cache lives in the container layer and every
      # rebuild/recreate wipes it, forcing a cold yt-dlp resolve for every
      # video again. DefaultDiskCacheDir in disk_cache.go.
      - youtube_cache:/var/cache/youtube-api
    ports:
      - '127.0.0.1:8081:8081'
    expose:
      - '8081'
    depends_on:
      - pot-provider

  dream-npc:
    networks: [app]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 512m
    cpus: '1.0'
    build:
      context: ../../services/dream-npc-go
      dockerfile: Dockerfile
    <<: *security
    restart: unless-stopped
    environment:
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    volumes:
      - dream_data:/app/data
    expose:
      - '4000'

  image-upload:
    networks: [app]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    mem_limit: 384m
    cpus: '1.0'
    build:
      context: ../../services/image-upload
    <<: *security
    restart: unless-stopped
    environment:
      - PORT=4001
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=club-mutant-images
      - R2_PUBLIC_URL=https://cdn.mutante.club
    expose:
      - '4001'

  pot-provider:
    networks: [app]
    mem_limit: 512m
    cpus: '1.0'
    # Official provider, versioned in lockstep with the yt-dlp plugin. The
    # plugin refuses to request a token when major versions differ, so this tag
    # MUST match the bgutil-ytdlp-pot-provider pin in youtube-api/Dockerfile.
    # (The previous ghcr.io/jim60105/bgutil-pot is a Rust port on its own 0.x
    # line, so it always tripped that check.)
    # The official 2.x image supplies --host 0.0.0.0 for container-to-container
    # access; its port stays unpublished on the host.
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    <<: *security
    restart: unless-stopped
    expose:
      - '4416'

  postgres:
    networks: [database]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g
    cpus: '1.0'
    image: postgres:16-alpine
    <<: *security
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  nakama:
    networks: [app, database]
    mem_limit: 512m
    cpus: '1.0'
    image: heroiclabs/nakama:3.24.2
    <<: *security
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../nakama/modules:/nakama/data/modules:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        /nakama/nakama migrate up --database.address=postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama \
          --database.address=postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama \
          --socket.server_key=${NAKAMA_SERVER_KEY} \
          --session.encryption_key=${NAKAMA_ENCRYPTION_KEY} \
          --session.token_expiry_sec=7200 \
          --session.refresh_token_expiry_sec=2592000 \
          --console.username=${NAKAMA_CONSOLE_USERNAME} \
          --console.password=${NAKAMA_CONSOLE_PASSWORD} \
          --runtime.http_key=${NAKAMA_RUNTIME_HTTP_KEY:?Set a private runtime HTTP key distinct from the public server key}
    expose:
      - '7350'
      - '7351'

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  dream_data:
  youtube_cache:

networks:
  edge:
  app:
  database:
    internal: true
